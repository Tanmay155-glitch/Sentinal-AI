[package]
name = "sentinel-ai"
version = "0.1.0"
description = "Sentinel AI — Intelligent Endpoint Threat Detection and Response System"
authors = ["Sentinel AI Team"]
edition = "2021"

[lib]
name = "sentinel_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
dirs-next = "2.0"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
ndarray = "0.16"
